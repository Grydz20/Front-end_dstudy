<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DStudy — Login</title>

    <!-- Estilos Globais e Específicos da Página -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ==============================
         FUNDO DECORATIVO (BOLHAS)
         ============================== -->
    <div class="bolhas" aria-hidden="true">
        <!-- Pequenas -->
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-1">
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-2">
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-3">
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-4">
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-5">
        <img src="assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-6">

        <!-- Médias -->
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-7">
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-8">
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-9">
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-10">

        <!-- Grandes -->
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-11">
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-12">
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-13">
                <!-- Grandes -->
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-11">
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-12">
        <img src="assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-13">
        <!-- Novas bolhas adicionadas -->
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-14">
        <img src="assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-15">
    </div>

    <!-- ==============================
         LOGO (centralizada)
         ============================== -->
    <header class="topo">
        <div class="logo-container">
            <img src="assets/img/logo.png" alt="Caveirinha DStudy" class="logo-icone">
            <span class="logo-texto">DStudy</span>
        </div>
    </header>

    <!-- ==============================
         FORMULÁRIO
         ============================== -->
    <main class="login-conteudo">
        <form class="form-login" id="form-login">

            <!-- Nome -->
            <div class="grupo-campo">
                <label for="nome">NOME:</label>
                <input type="text" id="nome" name="nome" class="input-pixel" autocomplete="username">
            </div>

            <!-- Senha -->
            <div class="grupo-campo">
                <label for="senha">SENHA:</label>
                <input type="password" id="senha" name="senha" class="input-pixel" autocomplete="current-password">
            </div>

            <!-- Botão -->
            <button type="submit" class="btn btn-rosa" id="btn-confirmar">
                CONFIRMAR
            </button>

        </form>
    </main>

</body>
</html>
